<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>404: Humanity Not Found</title>
    <style>
        body {
            background-color: #000000;
            color: white;
            height: 100vh;
            margin: 0;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            font-family: 'Share Tech Mono', monospace;
            overflow: hidden;
            position: relative;
            background: #000000;
        }
        
        @import url('https://fonts.googleapis.com/css2?family=Share+Tech+Mono&display=swap');
        
        .error-text, .subtext {
            position: relative;
            text-align: center;
        }

        .error-text {
            font-size: 3.5em;
            margin-bottom: 30px;
            text-shadow: 0 0 10px rgba(255, 255, 255, 0.7),
                         0 0 20px rgba(255, 255, 255, 0.5),
                         0 0 30px rgba(255, 255, 255, 0.3),
                         0 0 40px rgba(0, 0, 0, 0.8),
                         0 0 70px rgba(0, 0, 0, 1);
            letter-spacing: 2px;
            position: relative;
            z-index: 1;
        }
        
        .subtext {
            font-size: 1.8em;
            opacity: 0.9;
            text-shadow: 0 0 10px rgba(255, 255, 255, 0.5),
                         0 0 20px rgba(0, 0, 0, 0.8),
                         0 0 40px rgba(0, 0, 0, 1);
            letter-spacing: 1px;
            position: relative;
            z-index: 1;
        }

        @keyframes glitch {
            2%, 64% {
                transform: translate(2px, 0) skew(0deg);
            }
            4%, 60% {
                transform: translate(-2px, 0) skew(0deg);
            }
            62% {
                transform: translate(0, 0) skew(5deg);
            }
        }

        .error-text:before,
        .error-text:after,
        .subtext:before,
        .subtext:after {
            content: attr(data-text);
            position: absolute;
            left: 0;
            width: 100%;
        }

        .error-text:before,
        .subtext:before {
            animation: glitchTop 1s linear infinite;
            clip-path: polygon(0 0, 100% 0, 100% 33%, 0 33%);
            -webkit-clip-path: polygon(0 0, 100% 0, 100% 33%, 0 33%);
        }

        .error-text:after,
        .subtext:after {
            animation: glitchBottom 1.5s linear infinite;
            clip-path: polygon(0 67%, 100% 67%, 100% 100%, 0 100%);
            -webkit-clip-path: polygon(0 67%, 100% 67%, 100% 100%, 0 100%);
        }

        @keyframes glitchTop {
            2%, 64% {
                transform: translate(2px, -2px);
            }
            4%, 60% {
                transform: translate(-2px, 2px);
            }
            62% {
                transform: translate(13px, -1px) skew(-13deg);
            }
        }

        @keyframes glitchBottom {
            2%, 64% {
                transform: translate(-2px, 0);
            }
            4%, 60% {
                transform: translate(-2px, 0);
            }
            62% {
                transform: translate(-22px, 5px) skew(21deg);
            }
        }

        /* Remove pixel-related styles and keep enhanced glitch effects */
        .pixel-background, .particles, .pixel {
            display: none;
        }

        /* Update void effect */
        body::before {
            content: '';
            position: fixed;
            width: 100%;
            height: 300%;
            top: -100%;
            left: 0;
            z-index: -1;
            background: linear-gradient(180deg,
                rgba(0, 0, 0, 0) 0%,
                rgba(0, 0, 0, 0.2) 40%,
                rgba(0, 0, 0, 0.4) 60%,
                rgba(0, 0, 0, 0.8) 80%,
                rgb(0, 0, 0) 90%,
                rgb(0, 0, 0) 100%
            );
        }

        /* Floating particles */
        .particles {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -1;
            overflow: hidden;
        }

        .particle {
            position: absolute;
            background: linear-gradient(45deg, rgba(255,255,255,0.1), rgba(255,255,255,0.3));
            border-radius: 50%;
            box-shadow: 0 0 10px rgba(255,255,255,0.2);
        }

        @keyframes rotate {
            from {
                transform: rotate(0deg);
            }
            to {
                transform: rotate(360deg);
            }
        }

        @keyframes pixelEmerge {
            0% {
                transform: translateY(100%) scale(0.2);
                opacity: 0;
            }
            20% {
                transform: translateY(50%) scale(1.2);
                opacity: 1;
            }
            80% {
                transform: translateY(-50%) scale(1);
                opacity: 0.8;
            }
            100% {
                transform: translateY(-100%) scale(0.1);
                opacity: 0;
            }
        }

        @keyframes pixelGlitch {
            0% { 
                transform: translate(0, 0) skew(0deg) scale(1);
                filter: brightness(1) hue-rotate(0deg);
            }
            25% {
                transform: translate(-15px, 5px) skew(-45deg) scale(1.5);
                filter: brightness(2) hue-rotate(90deg);
            }
            50% {
                transform: translate(15px, -5px) skew(45deg) scale(0.7);
                filter: brightness(0.5) hue-rotate(-90deg);
            }
            75% {
                transform: translate(-10px, -10px) skew(-30deg) scale(1.2);
                filter: brightness(1.5) hue-rotate(180deg);
            }
        }

        /* Update depth layer */
        .depth-layer {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -3;
            background: radial-gradient(circle at 50% 70%, 
                rgba(50, 50, 70, 0.3) 0%,
                rgba(30, 30, 50, 0.3) 20%,
                rgba(20, 20, 40, 0.4) 40%,
                rgba(10, 10, 30, 0.5) 60%,
                rgba(5, 5, 20, 0.6) 80%,
                rgba(0, 0, 10, 0.7) 100%
            );
            transform: scale(1.5);
            animation: pulse 8s ease-in-out infinite;
        }

        @keyframes pulse {
            0%, 100% { transform: scale(1.5); }
            50% { transform: scale(1.8); }
        }

        /* Enhanced void source with more visible depth */
        .void-source {
            position: fixed;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 80vh;
            background: linear-gradient(to top,
                rgb(0, 0, 20) 0%,
                rgba(0, 5, 25, 0.98) 20%,
                rgba(0, 10, 30, 0.95) 40%,
                rgba(0, 5, 20, 0.9) 60%,
                rgba(0, 0, 10, 0.7) 80%,
                transparent 100%
            );
            z-index: -1;
            box-shadow: 
                0 -100px 200px rgba(0, 0, 40, 0.9),
                0 -50px 150px rgba(0, 30, 100, 0.3),
                0 -20px 50px rgba(0, 50, 255, 0.2);
            animation: voidGlitch 1s steps(3) infinite;
        }

        /* Digital corruption layers */
        .corruption-layer {
            position: fixed;
            width: 100%;
            height: 100%;
            top: 0;
            left: 0;
            z-index: -2;
            background: repeating-linear-gradient(
                0deg,
                transparent 0px,
                rgba(0, 0, 0, 0.1) 1px,
                transparent 2px
            );
            opacity: 0.3;
            pointer-events: none;
        }

        /* Add dystopian grid effect */
        .grid-overlay {
            position: fixed;
            width: 200%;
            height: 200%;
            top: -50%;
            left: -50%;
            background-image: 
                linear-gradient(rgba(0, 100, 255, 0.1) 1px, transparent 1px),
                linear-gradient(90deg, rgba(0, 100, 255, 0.1) 1px, transparent 1px);
            background-size: 30px 30px;
            transform: perspective(500px) rotateX(60deg);
            animation: gridMove 15s linear infinite;
            z-index: -3;
            opacity: 0.4;
        }

        @keyframes gridMove {
            0% {
                transform: perspective(500px) rotateX(60deg) translateY(0);
            }
            100% {
                transform: perspective(500px) rotateX(60deg) translateY(50px);
            }
        }

        /* Add data corruption effect */
        .data-corruption {
            position: fixed;
            width: 100%;
            height: 100%;
            top: 0;
            left: 0;
            z-index: -2;
            background: repeating-linear-gradient(
                90deg,
                transparent 0px,
                rgba(255, 255, 255, 0.05) 1px,
                rgba(255, 255, 255, 0.02) 2px,
                transparent 3px
            );
            animation: corruptionShift 0.5s steps(5) infinite;
            opacity: 0.8;
        }

        @keyframes corruptionShift {
            0%, 100% { transform: translateX(0) skewX(0deg); }
            25% { transform: translateX(-15px) skewX(2deg); }
            50% { transform: translateX(10px) skewX(-2deg); }
            75% { transform: translateX(-5px) skewX(1deg); }
        }

        /* Add severe glitch effect */
        .severe-glitch {
            position: fixed;
            width: 100%;
            height: 100%;
            top: 0;
            left: 0;
            z-index: -2;
            background: 
                linear-gradient(90deg,
                    transparent 0px,
                    rgba(0, 0, 0, 0.8) 1px,
                    rgba(0, 20, 40, 0.9) 2px,
                    transparent 3px
                ),
                repeating-linear-gradient(-45deg,
                    transparent 0px,
                    transparent 10px,
                    rgba(0, 10, 30, 0.4) 10px,
                    rgba(0, 10, 30, 0.4) 20px
                );
            animation: severeGlitch 0.2s steps(2) infinite;
            opacity: 0.95;
            mix-blend-mode: multiply;
        }

        @keyframes voidGlitch {
            0%, 100% {
                clip-path: inset(0 0 0 0);
                transform: translateX(0);
            }
            25% {
                clip-path: inset(0 -10px 10% 0);
                transform: translateX(-10px);
            }
            50% {
                clip-path: inset(15% 0 0 10px);
                transform: translateX(10px);
            }
            75% {
                clip-path: inset(5% 15px 0 0);
                transform: translateX(-5px);
            }
        }

        /* Add dystopian cityscape */
        .dystopian-city {
            position: fixed;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 60vh;
            background: 
                /* Destroyed buildings silhouettes */
                linear-gradient(transparent 0%, rgba(0, 0, 20, 0.8) 20%),
                repeating-linear-gradient(90deg,
                    transparent 0%,
                    transparent 2%,
                    rgba(0, 0, 40, 0.9) 2%,
                    rgba(0, 0, 40, 0.9) 4%,
                    transparent 4%,
                    transparent 6%,
                    rgba(0, 0, 60, 0.8) 6%,
                    rgba(0, 0, 60, 0.8) 8%
                );
            z-index: -2;
            animation: buildingGlitch 4s steps(2) infinite;
            opacity: 0.7;
            transform-origin: bottom;
        }

        /* Enhanced severe glitch */
        .severe-glitch {
            background: 
                linear-gradient(90deg,
                    transparent 0px,
                    rgba(255, 255, 255, 0.2) 1px,
                    rgba(0, 150, 255, 0.15) 2px,
                    transparent 3px
                ),
                repeating-linear-gradient(-45deg,
                    transparent 0px,
                    transparent 10px,
                    rgba(0, 30, 255, 0.1) 10px,
                    rgba(0, 30, 255, 0.1) 20px
                );
            animation: severeGlitch 0.3s steps(3) infinite;
            opacity: 0.9;
        }

        /* Add digital rain effect */
        .digital-rain {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -1;
            background: linear-gradient(180deg,
                transparent,
                rgba(0, 50, 255, 0.1) 50%,
                rgba(0, 20, 100, 0.2)
            );
            animation: digitalRain 20s linear infinite;
            opacity: 0.4;
        }

        @keyframes buildingGlitch {
            0% {
                transform: skewX(0deg) scaleY(1);
                filter: brightness(1);
            }
            10% {
                transform: skewX(-20deg) scaleY(1.1);
                filter: brightness(1.5) hue-rotate(90deg);
            }
            20% {
                transform: skewX(20deg) scaleY(0.9);
                filter: brightness(0.8) hue-rotate(-90deg);
            }
            30% {
                transform: skewX(0deg) scaleY(1);
                filter: brightness(1);
            }
        }

        @keyframes severeGlitch {
            0% { 
                transform: translate(0) skew(0deg); 
                filter: brightness(1);
            }
            25% { 
                transform: translate(-20px, 10px) skew(20deg); 
                filter: brightness(1.2);
            }
            50% { 
                transform: translate(15px, -8px) skew(-15deg); 
                filter: brightness(0.8);
            }
            75% { 
                transform: translate(-10px, -10px) skew(10deg); 
                filter: brightness(1.1);
            }
            100% { 
                transform: translate(0) skew(0deg); 
                filter: brightness(1);
            }
        }

        @keyframes digitalRain {
            0% {
                background-position: 0 0;
                opacity: 0.4;
            }
            50% {
                opacity: 0.6;
            }
            100% {
                background-position: 0 1000px;
                opacity: 0.4;
            }
        }
    </style>
</head>
<body>
    <div class="error-text" data-text="ERROR 404: HUMANITY NOT FOUND">ERROR 404: HUMANITY NOT FOUND</div>
    <div class="subtext" data-text="Did you really expect to find it here?">Did you really expect to find it here?</div>

    <script>
        // Remove pixel generation code
        const pixelBackground = document.querySelector('.pixel-background');
        if (pixelBackground) {
            pixelBackground.remove();
        }

        const particles = document.querySelector('.particles');
        if (particles) {
            particles.remove();
        }
    </script>

    <!-- Add depth layer div -->
    <div class="depth-layer"></div>

    <!-- Add new layers -->
    <div class="grid-overlay"></div>
    <div class="corruption-layer"></div>

    <div class="void-source"></div>

    <!-- Add data corruption layer -->
    <div class="data-corruption"></div>

    <!-- Add severe glitch layer -->
    <div class="severe-glitch"></div>

    <!-- Add new background elements -->
    <div class="digital-rain"></div>
    <div class="dystopian-city"></div>
</body>
</html>
